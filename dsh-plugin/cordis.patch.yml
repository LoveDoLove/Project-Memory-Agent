# dsh-project-memory: Cordis bundle patch.
#
# Two rows:
#   1. pma-skill-dir — add workspace skills/ as a custom skill root via
#      an insert row (avoids colliding with the official skill-filesystem
#      entry owned by @deepseek-ai/dsh-skill-filesystem / dsh-skills-manager).
#   2. project-memory-dsh — load the DSH glue plugin (dsh/plugin.mjs) which:
#      a) re-registers skills dynamically relative to the active workspace,
#      b) injects a first-time-init hint when AGENTS.md is absent,
#      c) registers cbm_* tools (codebase-memory-mcp bridge) when ctx.tools is present.

- insert:
    - id: pma-skill-dir
      name: cordis:plugin
      config:
        customSkillDirs:
          - skills
        includeDefaultRoots: true

- insert:
    - id: project-memory-dsh
      name: '@lovedolove/dsh-project-memory/dsh'
