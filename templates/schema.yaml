# Canonical Frontmatter Schema for Project Memory Knowledge Documents
#
# This schema applies to ALL knowledge document types, not just Solutions.
# It replaces the previous solution-only schema. Each knowledge type uses
# the same core fields; track-specific fields are noted below.
#
# Usage: copy the fields you need into your document's YAML frontmatter.
# Unknown fields are silently ignored; required fields must be present.

# ── Core Fields (all knowledge types) ────────────────────────────────────────

core:
  title:
    type: string
    required: true
    description: "Human-readable title of the knowledge unit"

  type:
    type: enum
    required: true
    values:
      - fact        # Current operational fact
      - architecture # How the system is structured
      - decision    # Why an engineering direction was chosen
      - solution    # How a concrete problem was solved
      - lesson      # Generalizable engineering principle
      - constraint  # Boundary future work must respect
      - workflow    # Repeatable procedure
      - reference   # On-demand lookup material
      - history     # Old state explaining current system
      - obsolete    # Invalid with no remaining value
    description: "Primary knowledge type (one per document)"

  status:
    type: enum
    required: true
    values:
      - draft         # Work in progress, unvalidated
      - current       # Active implementation exists, authoritative
      - deprecated    # Still present but should no longer be used
      - superseded    # Replaced by newer implementation (requires superseded_by)
      - historical    # No longer current but explains system rationale
      - abandoned     # Started, no longer pursued
    description: >
      Lifecycle State (Dimension 1 of 4): Active currency and evolution stage.
      Legacy values (in_progress, partial, experimental, unknown) are deprecated
      migration inputs and automatically mapped to the 4-D model.

  validation_state:
    type: enum
    required: false
    values:
      - unreviewed        # Extracted or migrated, not yet verified against current code
      - needs_review      # Potential drift detected, revalidation requested
      - potentially_stale # Source code modified; requires empirical verification
      - verified          # Checked and confirmed true against current code/tests
      - invalid           # Disproved by current code or failing tests
      - quarantined       # Blocked from active retrieval due to conflict
    description: "Validation State (Dimension 2 of 4): Empirical verification health"

  authority_level:
    type: enum
    required: false
    values:
      - candidate # Proposed extraction, stored in candidate queue
      - derived   # Regenerable from primary code/tests
      - canonical # Authoritative human/promoted engineering knowledge
    description: "Authority Level (Dimension 3 of 4): Trust and promotion stage"

  confidence:
    type: enum
    required: true
    values: [high, medium, low]
    description: >
      Confidence Level (Dimension 4 of 4): Certainty based on evidence diversity.
      high = multiple independent sources agree (source + tests + config).
      medium = one strong direct source.
      low = indirect, incomplete, or historical evidence.

  evidence:
    type: array
    required: false
    items:
      type: object
      properties:
        anchor:
          type: string
          description: "Canonical evidence anchor URI: ema://evidence/<repo-id>/<git-ref>/<file-path>#<logical-anchor>"
        path:
          type: string
          description: "Legacy file path with optional line number (src/file.ts:42)"
        type:
          type: enum
          values: [source, test, config, ci, git]
          description: "Kind of evidence"
      description: "Evidence item: requires either 'anchor' (canonical) or 'path' (legacy)"
    description: "Repository evidence backing this claim"

  scope:
    type: enum
    values: [project, workspace, global]
    required: false
    description: >
      Knowledge Scope: Cross-repository applicability boundary.
      project = repository-local knowledge.
      workspace = shared multi-repo engineering context.
      global = universal engineering principles across all workspaces.
      Note: Legacy values [domain, component, subsystem] represent intra-project
      architectural granularity, which belongs in tags or directory paths.

  scope_id:
    type: string
    required: false
    description: "Fully qualified scope URI (e.g. project:github.com/org/repo)"

  isolation:
    type: enum
    values: [soft, hard]
    required: false
    description: "Hard-isolation flag preventing cross-scope information leakage"

  tags:
    type: array
    required: false
    items:
      type: string
    description: "Searchable tags (corpus-first vocabulary rule applies)"

  created:
    type: date
    required: true
    format: "YYYY-MM-DD"
    description: "When the knowledge unit was created"

  last_verified:
    type: date
    required: true
    format: "YYYY-MM-DD"
    description: "When last checked against current repository evidence"

  # ── Relationship Fields ─────────────────────────────────────────────────────
  #
  # related: supports both plain strings (backward compatible) and typed
  # objects. Typed links are directional: the current document is the source
  # and the referenced path is the target. Use a typed link only when the
  # relationship reduces retrieval ambiguity; plain paths remain valid for
  # loose associations.
  #
  # Approved relationship semantics (source -> target):
  #   supersedes    - current source replaces target; use with target in
  #                   superseded/historical status.
  #   evolved_from  - source is a newer version of target.
  #   resolves      - source is the fix/decision/solution for target's
  #                   problem, bug, or symptom.
  #   caused_by     - source's problem/impact/constraint is caused by
  #                   target.
  #   affects       - source changes, constrains, or impacts target.
  #   belongs_to    - source is a sub-topic, detail, or component of target.
  #   contradicts   - source conflicts with target; resolution is required.
  #   derived_from  - source was distilled, inferred, or generalized from
  #                   target.
  #   promoted_from - source unit was promoted from target candidate/project.
  #   updates       - source updates or revises target.
  #   extends       - source builds upon or broadens target without replacing.
  #   derives       - source was used to infer or generate target.

  related:
    type: array
    required: false
    items:
      oneOf:
        - type: string         # Plain path (backward compatible)
        - type: object
          properties:
            path:
              type: string
              description: "Path to related knowledge document"
            target:
              type: string
              description: "Target URI or path (alias for path)"
            type:
              type: enum
              values:
                - supersedes     # "This replaces the target"
                - evolved_from   # "This evolved from the target (old version)"
                - resolves       # "This solves or addresses the target"
                - caused_by      # "This was caused by the target"
                - affects        # "This changes, constrains, or impacts the target"
                - belongs_to     # "I belong to this parent concept"
                - contradicts    # "This contradicts the target"
                - derived_from   # "This was derived from the target"
                - promoted_from  # "This was promoted from the target"
                - updates        # "This updates the target"
                - extends        # "This extends the target"
                - derives        # "This derives the target"
              description: "Semantic relationship type"
            verification:
              type: string
              description: "Verification status of the link (e.g. Verified, Needs Review)"
            notes:
              type: string
              description: "Contextual explanation of the relationship"
          required: [path]
    description: >
      Related knowledge units. Plain strings are backward-compatible.
      Typed links enable semantic retrieval. Typed relationships are directional
      and must not present superseded or obsolete targets as current authoritative knowledge.

  superseded_by:
    type: [string, null]
    required: false
    description: >
      Path to the knowledge unit that replaces this one. Required when
      status is 'superseded'. Must point to an existing document.

  promoted_from:
    type: object
    required: false
    properties:
      origin_scope:
        type: string
        description: "Source scope before promotion (e.g. project:github.com/org/sub-repo)"
      origin_id:
        type: string
        description: "Original document path or identifier in source scope"
      validated_by:
        type: string
        description: "Agent or human that validated the unit before promotion"
      promoted_by:
        type: string
        description: "Authorized actor (human/admin) that executed the promotion"
      promoted_at:
        type: string
        description: "ISO timestamp of the promotion event"
      rationale:
        type: string
        description: "Justification explaining multi-repo or global applicability"
      min_sources_checked:
        type: integer
        description: "Number of independent project repositories verified (>=2 for global)"
      audit_ref:
        type: string
        description: "Reference to audit entry in docs/CHANGELOG-MEMORY.md"
    description: "Structured provenance lineage for promoted knowledge units"

  consolidated_from:
    type: array
    required: false
    items:
      type: string
    description: >
      Origins merged into this unit during multi-source reconstruction.

  # ── Track-Specific Fields ───────────────────────────────────────────────────
  #
  # These fields are only required for specific knowledge types.
  # See track_specific below for per-type requirements.

track_specific:
  # Solution track (type: solution)
  solution_track:
    problem_type:
      type: enum
      required: true
      values: [bug, knowledge]
      description: "Bug track (defect) or knowledge track (practice gap)"

    # Bug track fields
    category:
      type: enum
      required: false
      when: "problem_type == bug"
      values:
        - bug
        - test_failure
        - runtime_error
        - performance_issue
        - integration_issue
        - security_issue
        - ui_bug
        - logic_error
        - build_error

    module:
      type: string
      required: false
      description: "Affected module or subsystem"

    symptoms:
      type: array
      required: false
      when: "problem_type == bug"
      items: string
      description: "Observable failures (required for bug track)"

    root_cause:
      type: string
      required: false
      when: "problem_type == bug"
      description: "Verified mechanism (required for bug track)"

    resolution_type:
      type: enum
      required: false
      when: "problem_type == bug"
      values:
        - code_fix
        - migration
        - config_change
        - test_fix
        - dependency_update
        - refactor

    # Knowledge track fields
    applies_when:
      type: string
      required: false
      when: "problem_type == knowledge"
      description: "Conditions where this guidance applies (required for knowledge track)"

    category_k:
      type: enum
      required: false
      when: "problem_type == knowledge"
      values:
        - best_practice
        - convention
        - tooling_decision
        - workflow_issue
        - developer_experience
        - architecture_pattern
        - documentation_gap

    severity:
      type: enum
      required: true
      values: [critical, high, medium, low]
      description: "Impact severity (required for all solutions)"

  # Decision track (type: decision)
  decision_fields:
    rationale:
      type: string
      required: false
      description: "Why this direction was chosen over alternatives"
    alternatives:
      type: array
      required: false
      items: string
      description: "Rejected or considered alternatives"
    consequences:
      type: string
      required: false
      description: "What follows from this decision"

  # Lesson track (type: lesson)
  lesson_fields:
    generalizable_from:
      type: string
      required: false
      description: "What experience or incident this was distilled from"

  # Constraint track (type: constraint)
  constraint_fields:
    enforced_by:
      type: string
      required: false
      description: "What enforces this constraint (tool, platform, policy)"
    violation_impact:
      type: string
      required: false
      description: "What happens if this constraint is violated"

  # Workflow track (type: workflow)
  workflow_fields:
    steps:
      type: array
      required: false
      items: string
      description: "High-level steps in the workflow"

  # Architecture track (type: architecture)
  architecture_fields:
    invariants:
      type: array
      required: false
      items: string
      description: "Important invariants that must hold"

# ── Domain README Frontmatter (special case) ──────────────────────────────────
#
# Domain README files (docs/<domain>/README.md) use a simplified schema:

domain_readme:
  title:
    type: string
    required: true
  last_indexed:
    type: date
    required: false
    format: "YYYY-MM-DD"
    description: "Date when this domain index was last refreshed"
  pending_updates:
    type: integer
    required: false
    default: 0
    description: >
      Number of child knowledge units that have been updated since
      last_indexed. Incremented by repository-audit when children change.
      Reset to 0 after domain index is refreshed.
  summary:
    type: string
    required: false
    description: "One-line L0 summary of this domain (for AGENTS.md cross-reference)"

# ── Validation Rules ──────────────────────────────────────────────────────────

validation:
  rules:
    - "type and status determine which track-specific fields are required"
    - "confidence must be high, medium, or low (never 'unknown' in published docs)"
    - "related paths must resolve to existing files (checked by memory-verification)"
    - "superseded_by must point to an existing document when status is 'superseded'"
    - "created and last_verified must be valid YYYY-MM-DD dates"
    - "typed related links must use one of the eight relationship types"
    - "typed related links must not present superseded or obsolete targets as current authoritative knowledge"
    - "typed related links are checked by the Typed Relationship Verification Gate in memory-verification (syntactic, semantic/direction, lifecycle, and evidence tiers)"
    - "plain-string related: entries are legacy/untyped and remain valid; only target existence is checked"
    - "tags follow corpus-first vocabulary rule — sample existing corpus before choosing"
    - "title must be unique within the repository"
