name: Publish dsh-plugin to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - 'dsh-plugin/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required for publishing to GitHub Packages
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # package.json has publishConfig.registry set to npm.pkg.github.com;
          # setup-node's registry-url only affects its own auth setup, not npm's.
          # We rely on GITHUB_TOKEN (auto-injected) for authentication.
          registry-url: 'https://npm.pkg.github.com'

      - run: npm install

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
