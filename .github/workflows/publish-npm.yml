name: Publish dsh-plugin to npm

on:
  push:
    branches: [main]
    paths:
      - 'dsh-plugin/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # npm install creates package-lock.json required by `npm publish`
      - uses: actions/cache@v4
        with:
          path: dsh-plugin/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('dsh-plugin/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm install

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
